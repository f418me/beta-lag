[project]
name = "beta-lag"
version = "0.1.0"
description = "Reproducible cross-asset signal research and paper trading"
authors = [
    { name = "Felix Frei", email = "felix.frei@gmx.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "duckdb>=1.4,<2",
    "pydantic>=2.11,<3",
]

[project.scripts]
beta-lag = "beta_lag.cli:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
